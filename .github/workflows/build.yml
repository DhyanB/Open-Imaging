name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-java: ['8', '11', '17']

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember Gradle JDK
        run: echo "GRADLE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}
      - name: Build and test
        run: ./gradlew build -PtestJavaVersion=${{ matrix.test-java }} -Dorg.gradle.java.home="$GRADLE_JAVA_HOME" -Dorg.gradle.java.installations.paths="$JAVA_HOME"
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: JUnit tests (Java ${{ matrix.test-java }})
          path: build/test-results/test/TEST-*.xml
          reporter: java-junit
      - name: Summarize coverage
        if: ${{ !cancelled() && matrix.test-java == '17' }}
        run: |
          coverage=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          line_counter = next(counter for counter in report.findall('counter')
                              if counter.attrib['type'] == 'LINE')
          covered = int(line_counter.attrib['covered'])
          total = covered + int(line_counter.attrib['missed'])
          print(f'{covered / total:.1%} ({covered} of {total} lines)')
          PY
          )
          echo "Code coverage: $coverage"
          {
            echo "## Code coverage"
            echo "Line coverage: **$coverage**."
          } >> "$GITHUB_STEP_SUMMARY"
