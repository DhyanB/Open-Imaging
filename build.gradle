plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.3'
}

group = 'at.dhyan'
version = '1'
description = 'Open Imaging'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        target 'src/test/java/at/dhyan/open_imaging/test/**/*.java'
        googleJavaFormat().aosp()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def testJavaVersion = providers.gradleProperty('testJavaVersion')
        .map { JavaLanguageVersion.of(it as Integer) }
        .orElse(JavaLanguageVersion.of(21))

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion.set(testJavaVersion)
    }
    filter {
        excludeTestsMatching '*.*benchmark'
        excludeTestsMatching '*.*writeFrames*'
    }
    testLogging {
        outputs.upToDateWhen { false } // Always prints stdout
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('exportFrames', Test) {
    description = 'Decode test GIFs and write their frames to build/output-frames.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    jacoco {
        enabled = false
    }
    filter {
        includeTestsMatching '*.*writeFrames*'
    }
}

tasks.register('benchmark', Test) {
    description = 'Run GIF decoder benchmarks.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    jacoco {
        enabled = false
    }
    filter {
        includeTestsMatching '*.*benchmark'
    }
    testLogging {
        outputs.upToDateWhen { false }
        showStandardStreams = true
    }
    systemProperty 'warmups', System.getProperty('warmups', '1')
    systemProperty 'runs', System.getProperty('runs', '1')
}

tasks.register('generateFrameHashes', JavaExec) {
    description = 'Generate candidate GIF frame hashes in build/frame-hashes.sha256.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'at.dhyan.open_imaging.test.FrameHashGenerator'
    final output = layout.buildDirectory.file('frame-hashes.sha256')
    args(output.get().asFile.absolutePath)
    outputs.file(output)
}
