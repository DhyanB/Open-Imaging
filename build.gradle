plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.3'
}

group = 'at.dhyan'
version = '1'
description = 'Open Imaging'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def testJavaVersion = providers.gradleProperty('testJavaVersion')
        .map { JavaLanguageVersion.of(it as Integer) }
        .orElse(JavaLanguageVersion.of(17))

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion.set(testJavaVersion)
    }
    filter {
        excludeTestsMatching '*.*benchmark'
        excludeTestsMatching '*.*writeFrames*'
    }
    testLogging {
        outputs.upToDateWhen { false } // Always prints stdout
        showStandardStreams = true
    }
    systemProperties(System.getProperties())
}

tasks.register('exportFrames', Test) {
    description = 'Decode test GIFs and write their frames to build/output-frames.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*.*writeFrames*'
    }
}

tasks.register('benchmark', Test) {
    description = 'Run GIF decoder benchmarks.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*.*benchmark'
    }
    testLogging {
        outputs.upToDateWhen { false }
        showStandardStreams = true
    }
    systemProperties(System.getProperties())
}

tasks.register('generateFrameHashes', JavaExec) {
    description = 'Generate candidate GIF frame hashes in build/frame-hashes.sha256.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'at.dhyan.open_imaging.test.FrameHashGenerator'
    final output = layout.buildDirectory.file('frame-hashes.sha256')
    args(output.get().asFile.absolutePath)
    outputs.file(output)
}
